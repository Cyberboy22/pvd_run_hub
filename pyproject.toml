[project]
name = "pvd-run-hub"
version = "0.1.0"
description = "PVD process data: raw plant logs -> cleaned phases -> SQLite -> drift monitor -> Gaussian-process model (simulated demo data)"
authors = [{ name = "Arif Onur Alp" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
